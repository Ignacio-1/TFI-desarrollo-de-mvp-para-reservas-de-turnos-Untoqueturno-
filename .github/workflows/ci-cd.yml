name: CI/CD Pipeline - Untoqueturno

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test-and-lint:
    name: Pruebas y Control de Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias (Monorepo)
        run: |
          cd apps/untoqueturno-bff && npm install
          cd ../../services/availability && npm install
          cd ../subscriptions && npm install
          cd ../ai-assistant && npm install

      - name: Ejecutar Batería de Pruebas (Unitarias y Defensivas)
        run: |
          cd apps/untoqueturno-bff
          npm run test

  deploy-infrastructure:
    name: Despliegue de Infraestructura (Terraform)
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Determinar Ambiente (Dev/QA/Prod)
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TF_VAR_ENV=prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "TF_VAR_ENV=dev" >> $GITHUB_ENV
          else
            echo "TF_VAR_ENV=qa" >> $GITHUB_ENV
          fi

      - name: Terraform Init & Validate
        working-directory: ./infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Apply (Simulado para TFI)
        working-directory: ./infrastructure/terraform
        run: echo "🚀 Despliegue exitoso con Terraform en el ambiente de ${{ env.TF_VAR_ENV }}"
