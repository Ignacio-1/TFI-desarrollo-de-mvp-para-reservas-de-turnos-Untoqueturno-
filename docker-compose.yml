version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: untoqueturno_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: untoqueturno_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: 
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: untoqueturno_gateway
    ports:
      - "8080:8080"
    depends_on:
      - availability-service
      - subscriptions-service

  availability-service:
    build: 
      context: ./services/availability
      dockerfile: Dockerfile
    deploy:
      replicas: 3
    environment:
      - RABBITMQ_URL=amqp://admin:secret@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  subscriptions-service:
    build: 
      context: ./services/subscriptions
      dockerfile: Dockerfile
    container_name: untoqueturno_subscriptions
    environment:
      - RABBITMQ_URL=amqp://admin:secret@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
